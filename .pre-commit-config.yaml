repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
        types: [python]

  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        types: [python]

  - repo: https://github.com/pycqa/flake8
    rev: 7.0.0
    hooks:
      - id: flake8
        additional_dependencies: [flake8-bugbear]
        types: [python]

  - repo: local
    hooks:
      - id: import-linter
        name: import-linter
        entry: python -c "import sys, os; sys.path.insert(0, os.path.abspath('backend')); from importlinter.cli import lint_imports; sys.exit(lint_imports())"
        language: system
        pass_filenames: false
        files: \.py$
